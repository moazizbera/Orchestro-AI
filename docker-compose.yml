version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Orchestro AI  ·  Full-stack local development stack
# ─────────────────────────────────────────────────────────────────────────────
#  Services:   mongodb  ·  backend (FastAPI)  ·  frontend (React/Vite)
#  Usage:      docker compose up --build
#  Production: deploy backend/ to Cloud Run, frontend/ to Firebase Hosting
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── MongoDB (local dev mirror of MongoDB Atlas) ────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: orchestro-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: orchestro_ai
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI — mirrors Cloud Run container) ────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orchestro-backend
    restart: unless-stopped
    ports:
      - '8000:8080'
    env_file:
      - ./backend/.env
    environment:
      # Override so the backend can reach the mongodb container by name
      MONGODB_URI: mongodb://mongodb:27017
      PORT: 8080
    depends_on:
      mongodb:
        condition: service_healthy

  # ── Frontend (Vite dev server) ─────────────────────────────────────────────
  frontend:
    image: node:22-alpine
    container_name: orchestro-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '5173:5173'
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data:
